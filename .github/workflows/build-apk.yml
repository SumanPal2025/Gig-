name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          JAVA_VER=$(java -version 2>&1 | head -n 1 | awk -F '"' '{print $2}' | awk -F '.' '{print $1}')
          if [ -z "$JAVA_VER" ]; then
            echo "Error: Could not detect Java version."
            exit 1
          fi
          echo "Detected Java Major Version: $JAVA_VER"
          if [ "$JAVA_VER" -lt 17 ]; then
            echo "Error: Active Java major version must be 17 or higher, detected $JAVA_VER."
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ ! -f ./debug.keystore ]; then
            echo "Generating temporary debug keystore..."
            keytool -genkey -v -keystore ./debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA -keysize 2048 -validity 10000
          else
            echo "debug.keystore already exists."
          fi

          if [ ! -f ./debug.keystore ]; then
            echo "Error: debug.keystore could not be created."
            exit 1
          fi
          echo "Temporary debug keystore verified."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          TARGET_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$TARGET_APK" ]; then
            echo "Expected debug APK missing! Searching inside app/build/outputs/apk:"
            find app/build/outputs/apk -maxdepth 3 -name "*.apk" || true
            echo "Error: Expected debug APK $TARGET_APK does not exist."
            exit 1
          fi

          if [ ! -s "$TARGET_APK" ]; then
            echo "Error: $TARGET_APK is an empty file."
            exit 1
          fi

          echo "Debug APK verified: $TARGET_APK"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          REPO_NAME=$(echo "${{ github.repository }}" | awk -F'/' '{print $2}' | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9_-]/-/g')
          RUN_NUM="${{ github.run_number }}"
          RELEASE_APK_NAME="${REPO_NAME}-debug-build-${RUN_NUM}.apk"
          TEMP_DIR="${{ runner.temp }}/release_asset_dir"
          mkdir -p "$TEMP_DIR"
          cp app/build/outputs/apk/debug/app-debug.apk "${TEMP_DIR}/${RELEASE_APK_NAME}"

          if [ ! -f "${TEMP_DIR}/${RELEASE_APK_NAME}" ] || [ ! -s "${TEMP_DIR}/${RELEASE_APK_NAME}" ]; then
            echo "Error: Failed to prepare release asset."
            exit 1
          fi

          echo "asset_path=${TEMP_DIR}/${RELEASE_APK_NAME}" >> $GITHUB_OUTPUT
          echo "asset_name=${RELEASE_APK_NAME}" >> $GITHUB_OUTPUT
          echo "Prepared release asset: ${TEMP_DIR}/${RELEASE_APK_NAME}"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version

          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Prepared release asset $ASSET_PATH is missing or empty."
            exit 1
          fi

          TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          TITLE="Debug APK Build #${{ github.run_number }}"

          NOTES="This is an automatically generated debug APK.
          The APK was built by GitHub Actions.
          - Run number: ${{ github.run_number }}
          - Run attempt: ${{ github.run_attempt }}
          - Source commit: ${{ github.sha }}

          Important Note:
          - The APK is intended for testing.
          - The APK is not a Play Store production release.
          - The APK is signed only with a temporary debug keystore."

          gh release create "$TAG" "$ASSET_PATH" \
            --title "$TITLE" \
            --notes "$NOTES" \
            --target "${{ github.sha }}" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          TITLE="Debug APK Build #${{ github.run_number }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ "${{ steps.publish_release.outcome }}" == "success" ]; then
            echo "GitHub Release published successfully!"
            gh release view "$TAG"
            RELEASE_URL=$(gh release view "$TAG" --json url -q .url)
            echo "Release Tag: $TAG"
            echo "Release Title: $TITLE"
            echo "Release Page URL: $RELEASE_URL"
            echo "APK Asset Filename: $ASSET_NAME"

            {
              echo "### 🚀 Debug APK Build & Release Succeeded"
              echo ""
              echo "The debug APK was built and published to GitHub Releases:"
              echo "- **Release Page**: [$TITLE]($RELEASE_URL)"
              echo "- **Release Tag**: \`$TAG\`"
              echo "- **APK Asset**: \`$ASSET_NAME\`"
              echo ""
              echo "You can download the APK directly from the **Assets** section of the release page on your mobile device."
              echo "The normal GitHub Actions artifact named \`app-debug-apk\` is also available as a backup."
            } >> $GITHUB_STEP_SUMMARY
          else
            echo "::warning ::GitHub Release publishing failed or was skipped."
            echo "APK build and artifact upload succeeded."
            echo "The artifact 'app-debug-apk' remains available."

            {
              echo "### ⚠️ Debug APK Build Succeeded (Release Publishing Failed)"
              echo ""
              echo "The debug APK was built and verified successfully, but GitHub Release publishing encountered an issue."
              echo "- **Backup Artifact**: The debug APK artifact named \`app-debug-apk\` remains available on this workflow run summary page."
            } >> $GITHUB_STEP_SUMMARY
          fi
